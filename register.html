<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background-color: #0F172A; min-height: 100vh; }
        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .auth-card { background: #FFFFFF; border-top: 5px solid #FF5330; border-radius: 24px; max-width: 430px; width: 100%; padding: 2.25rem; }
        .auth-logo-img { height: 68px; width: auto; object-fit: contain; }
        .btn-rotom { background-color: #FF5330; color: #FFFFFF; border: none; border-radius: 12px; font-weight: 700; }
        .btn-rotom:hover { background-color: #E03A1B; color: #FFFFFF; }
    </style>
    <title>PokeAPI - Iniciar Sesion</title>
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card shadow-lg">
            <div class="text-center mb-4">
                <div class="mb-2">
                    <img src="img/logo.png" alt="PokeAPI" class="auth-logo-img">
                </div>
                <p class="text-muted small mb-0">Inicia sesion para acceder a la base de datos Pokemon</p>
            </div>

            <div id="authAlert" class="d-none"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginUsername" class="form-label fw-semibold small text-secondary">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" id="loginUsername" class="form-control border-start-0" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="loginPassword" class="form-label fw-semibold small text-secondary">Contrasena</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" id="loginPassword" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-rotom w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar a la Pokedex
                </button>
            </form>

            <div class="border-top pt-3 mb-3">
                <p class="small text-muted fw-semibold mb-2 text-center">Perfiles precargados (clave: 123):</p>
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <button type="button" class="btn btn-outline-warning text-dark btn-sm rounded-pill px-3 fw-semibold" data-demo-user="admin">
                        <i class="bi bi-shield-lock"></i> admin
                    </button>
                    <button type="button" class="btn btn-outline-primary text-dark btn-sm rounded-pill px-3 fw-semibold" data-demo-user="moderador">
                        <i class="bi bi-shield-check"></i> moderador
                    </button>
                    <button type="button" class="btn btn-outline-info text-dark btn-sm rounded-pill px-3 fw-semibold" data-demo-user="investigador">
                        <i class="bi bi-journal-medical"></i> investigador
                    </button>
                    <button type="button" class="btn btn-outline-secondary text-dark btn-sm rounded-pill px-3 fw-semibold" data-demo-user="usuario">
                        <i class="bi bi-person"></i> usuario
                    </button>
                </div>
            </div>

            <div class="text-center small text-muted">
                ¿No tienes cuenta? <a href="register.html" class="fw-bold text-decoration-none" style="color: #FF5330;">Registrate aqui</a>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
